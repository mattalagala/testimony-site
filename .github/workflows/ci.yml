name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bicep build
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          SQL_ADMIN_GROUP_ID=00000000-0000-0000-0000-000000000000 SQL_ADMIN_GROUP_NAME=placeholder \
            az bicep build-params --file infra/dev.bicepparam --stdout > /dev/null

  db-integration:
    name: DB migrations + repository tests (SQL Server container)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Ci-Only-Passw0rd!
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Only-Passw0rd!' -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 20s
    env:
      SQL_SERVER: localhost
      SQL_DATABASE: master
      SQL_USER: sa
      SQL_PASSWORD: Ci-Only-Passw0rd!
      SQL_TRUST_SERVER_CERTIFICATE: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration -w db
      - run: npm run test:integration -w api

  e2e-local:
    name: E2E (local stack, sample data)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w web
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-local
          path: playwright-report
          retention-days: 7

  # ---- Azure (switched on by repo variable AZURE_ENABLED=true) ----

  preview:
    name: Preview environment + E2E
    needs: [verify]
    if: >-
      vars.AZURE_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      RG: ${{ vars.AZURE_RG }}
      SQL_ADMIN_GROUP_ID: ${{ vars.SQL_ADMIN_GROUP_ID }}
      SQL_ADMIN_GROUP_NAME: ${{ vars.SQL_ADMIN_GROUP_NAME }}
      # Each PR gets its own database (free offer), dropped when the PR closes.
      PREVIEW_DB: testimony-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Check Azure variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RG: ${{ vars.AZURE_RG }}
          SQL_ADMIN_GROUP_ID: ${{ vars.SQL_ADMIN_GROUP_ID }}
          SQL_ADMIN_GROUP_NAME: ${{ vars.SQL_ADMIN_GROUP_NAME }}
        run: |
          missing=()
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RG SQL_ADMIN_GROUP_ID SQL_ADMIN_GROUP_NAME; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing variables in GitHub environment 'dev': ${missing[*]}. Run ./infra/bootstrap.sh dev <subscription>."
            exit 1
          fi

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep what-if
        run: |
          az deployment group what-if -g "$RG" \
            --template-file infra/main.bicep --parameters infra/dev.bicepparam \
            --result-format ResourceIdOnly | tee what-if.txt
          { echo '### Bicep what-if (dev)'; echo '```'; cat what-if.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Find Static Web App
        id: swa
        run: |
          name=$(az staticwebapp list -g "$RG" --query "[0].name" -o tsv)
          if [ -z "$name" ]; then
            echo "::notice::No Static Web App in $RG yet. Merge to main once to provision dev; previews start after that."
            echo "exists=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          token=$(az staticwebapp secrets list -n "$name" -g "$RG" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          sql=$(az sql server list -g "$RG" --query "[0].name" -o tsv)
          pw=$(az staticwebapp appsettings list -n "$name" -g "$RG" --query "properties.SQL_PASSWORD" -o tsv 2>/dev/null || true)
          if [ -z "$sql" ] || [ -z "$pw" ] || [ "$pw" = "None" ]; then
            echo "::error::Dev isn't fully provisioned (SQL server or API password missing). Re-run the Deploy (dev) workflow."; exit 1
          fi
          echo "::add-mask::$pw"
          { echo "exists=true"; echo "name=$name"; echo "token=$token"; echo "sqlServer=$sql"; echo "password=$pw"; } >> "$GITHUB_OUTPUT"

      - name: Prepare preview database
        if: steps.swa.outputs.exists == 'true'
        env:
          SQL_SERVER_NAME: ${{ steps.swa.outputs.sqlServer }}
          SQL_DATABASE: ${{ env.PREVIEW_DB }}
          APP_DB_PASSWORD: ${{ steps.swa.outputs.password }}
          APP_ENVIRONMENT: preview
          CREATE_IF_MISSING: 'true'
        # Creates the DB on first run, then migrates with THIS PR's migrations and seeds samples.
        run: .github/scripts/prepare-database.sh

      - name: Deploy preview
        id: deploy
        if: steps.swa.outputs.exists == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ github.token }}
          action: upload
          app_location: web/dist
          api_location: api/.deploy
          skip_app_build: true
          skip_api_build: true

      - name: Point preview environment at its database
        if: steps.swa.outputs.exists == 'true'
        env:
          SWA: ${{ steps.swa.outputs.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          settings=$(az staticwebapp appsettings list -n "$SWA" -g "$RG" --query properties -o json)
          mapfile -t pairs < <(echo "$settings" | jq -r --arg db "$PREVIEW_DB" \
            '.SQL_DATABASE = $db | .APP_ENVIRONMENT = "preview" | to_entries[] | "\(.key)=\(.value)"')
          az staticwebapp appsettings set -n "$SWA" -g "$RG" --environment-name "$PR" \
            --setting-names "${pairs[@]}" --output none

      - name: Wait for preview API (serverless DB may be resuming)
        if: steps.swa.outputs.exists == 'true'
        env:
          URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health" || true)
            echo "attempt $i: $code"; [ "$code" = "200" ] && exit 0; sleep 10
          done
          echo "::error::Preview API did not become healthy at $URL"; exit 1

      - name: E2E against preview
        if: steps.swa.outputs.exists == 'true'
        env:
          BASE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
          echo "Preview: $BASE_URL" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-preview
          path: playwright-report
          retention-days: 7

  close-preview:
    name: Close preview environment
    if: >-
      vars.AZURE_ENABLED == 'true' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Get deployment token
        id: swa
        run: |
          name=$(az staticwebapp list -g "${{ vars.AZURE_RG }}" --query "[0].name" -o tsv)
          [ -z "$name" ] && { echo "exists=false" >> "$GITHUB_OUTPUT"; exit 0; }
          token=$(az staticwebapp secrets list -n "$name" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          { echo "exists=true"; echo "token=$token"; } >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@v1
        if: steps.swa.outputs.exists == 'true'
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: close
          app_location: web/dist
      - name: Drop preview database
        env:
          RG: ${{ vars.AZURE_RG }}
          DB: testimony-pr-${{ github.event.pull_request.number }}
        run: |
          sql=$(az sql server list -g "$RG" --query "[0].name" -o tsv)
          if [ -n "$sql" ] && az sql db show -g "$RG" -s "$sql" -n "$DB" -o none 2>/dev/null; then
            az sql db delete -g "$RG" -s "$sql" -n "$DB" --yes -o none
            echo "Dropped $DB"
          else
            echo "No preview database $DB to drop."
          fi
