name: Deploy (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deployments at once, and never cancel one halfway through a migration.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Infra → migrate → deploy → smoke test
    if: vars.AZURE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: dev
    env:
      RG: ${{ vars.AZURE_RG }}
      APP_ENVIRONMENT: dev
      SQL_ADMIN_GROUP_ID: ${{ vars.SQL_ADMIN_GROUP_ID }}
      SQL_ADMIN_GROUP_NAME: ${{ vars.SQL_ADMIN_GROUP_NAME }}
      APP_DB_USER: api_app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check Azure variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RG: ${{ vars.AZURE_RG }}
          SQL_ADMIN_GROUP_ID: ${{ vars.SQL_ADMIN_GROUP_ID }}
          SQL_ADMIN_GROUP_NAME: ${{ vars.SQL_ADMIN_GROUP_NAME }}
        run: |
          missing=()
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RG SQL_ADMIN_GROUP_ID SQL_ADMIN_GROUP_NAME; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing variables in GitHub environment 'dev': ${missing[*]}. Run ./infra/bootstrap.sh dev <subscription>."
            exit 1
          fi

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure (Bicep)
        id: infra
        run: |
          az deployment group create -g "$RG" -n "testimony-${GITHUB_RUN_ID}" \
            --template-file infra/main.bicep --parameters infra/dev.bicepparam \
            --query properties.outputs -o json > outputs.json
          ai=$(jq -r .appInsightsConnectionString.value outputs.json)
          echo "::add-mask::$ai"
          {
            echo "swa=$(jq -r .staticWebAppName.value outputs.json)"
            echo "hostname=$(jq -r .staticWebAppHostname.value outputs.json)"
            echo "sqlServer=$(jq -r .sqlServerName.value outputs.json)"
            echo "sqlFqdn=$(jq -r .sqlServerFqdn.value outputs.json)"
            echo "sqlDb=$(jq -r .sqlDatabaseName.value outputs.json)"
            echo "appInsights=$ai"
          } >> "$GITHUB_OUTPUT"
          rm outputs.json

      - name: Resolve API database password
        id: dbpw
        run: |
          existing=$(az staticwebapp appsettings list -n "${{ steps.infra.outputs.swa }}" -g "$RG" \
            --query "properties.SQL_PASSWORD" -o tsv 2>/dev/null || true)
          if [ -z "$existing" ] || [ "$existing" = "None" ]; then
            existing="Tq9-$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 36)"
            echo "Generated a new API database password."
          fi
          echo "::add-mask::$existing"
          echo "password=$existing" >> "$GITHUB_OUTPUT"

      - name: Migrate, seed samples, ensure API user
        env:
          SQL_SERVER_NAME: ${{ steps.infra.outputs.sqlServer }}
          SQL_DATABASE: ${{ steps.infra.outputs.sqlDb }}
          APP_DB_PASSWORD: ${{ steps.dbpw.outputs.password }}
        # Opens the SQL firewall for this runner and always closes it again.
        run: .github/scripts/prepare-database.sh

      - name: Configure app settings
        run: |
          az staticwebapp appsettings set -n "${{ steps.infra.outputs.swa }}" -g "$RG" --output none \
            --setting-names \
              "SQL_SERVER=${{ steps.infra.outputs.sqlFqdn }}" \
              "SQL_DATABASE=${{ steps.infra.outputs.sqlDb }}" \
              "SQL_USER=$APP_DB_USER" \
              "SQL_PASSWORD=${{ steps.dbpw.outputs.password }}" \
              "APPLICATIONINSIGHTS_CONNECTION_STRING=${{ steps.infra.outputs.appInsights }}" \
              "APP_ENVIRONMENT=$APP_ENVIRONMENT"

      - name: Get deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list -n "${{ steps.infra.outputs.swa }}" -g "$RG" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy site + API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: web/dist
          api_location: api/.deploy
          skip_app_build: true

      - name: Wait for API health
        env:
          URL: https://${{ steps.infra.outputs.hostname }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health" || true)
            echo "attempt $i: $code"; [ "$code" = "200" ] && exit 0; sleep 10
          done
          echo "::error::API did not become healthy at $URL"; exit 1

      - name: Smoke test
        env:
          BASE_URL: https://${{ steps.infra.outputs.hostname }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --grep @smoke --project desktop
          echo "Deployed: $BASE_URL" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report
          retention-days: 7
